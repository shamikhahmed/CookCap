<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1512" />
    <title>Offline — Jia Cooks</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #ece1d1;
        --ink: #2a2118;
        --soft: #6b5a48;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1a1512;
          --ink: #f0e6d8;
          --soft: #b5a189;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, 'Times New Roman', serif;
        background: var(--paper);
        color: var(--ink);
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--soft);
        max-width: 28rem;
        line-height: 1.5;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Jia Cooks still works without a network once you’ve opened it before. Recipes, notes, and
        your shopping list live on this device.
      </p>
      <p><a href="/">Open the book</a></p>
    </main>
  </body>
</html>
